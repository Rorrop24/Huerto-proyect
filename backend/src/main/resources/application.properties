spring.application.name=huerto-api
server.port=8080

# Base de datos de XAMPP (MySQL/MariaDB en el puerto 3306, usuario root sin contraseña).
# createDatabaseIfNotExist=true crea la base huerto_db la primera vez que se levanta el proyecto.
spring.datasource.url=jdbc:mysql://localhost:3306/huerto_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway crea las tablas con los scripts de src/main/resources/db/migration.
# Por eso Hibernate solo valida que las entidades coincidan con las tablas (no las modifica).
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Devuelve el mensaje de error a la app (por ejemplo "Sector no encontrado.").
server.error.include-message=always
springdoc.swagger-ui.path=/swagger-ui.html
